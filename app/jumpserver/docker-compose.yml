#!/usr/bin/env docker compose
---
#==============================================================#
# File      :   docker-compose.yml
# Desc      :   JumpServer docker compose with Pigsty PostgreSQL
# Ctime     :   2026-07-09
# Mtime     :   2026-11-06
# Path      :   app/jumpserver/docker-compose.yml
# Docs      :   https://pigsty.io/docs/app/jumpserver
# Source    :   https://github.com/jumpserver/installer/tree/83facb768be7b60e7d38d498ed24214538899c67
# License   :   Apache-2.0 @ https://pigsty.io/docs/about/license/
# Copyright :   2018-2026  Ruohang Feng / Vonng (rh@vonng.com)
#==============================================================#

name: jumpserver

x-redis-client-env: &redis-client-env
  # Match the Redis service when Compose variables are overridden in the shell.
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD}

services:

  # Apply migrations and initialize the terminal host key before Core caches
  # Django settings. Existing terminal keys are validated, never replaced.
  init:
    container_name: jms_init
    hostname: jms_init
    image: ${IMAGE_PULL_PREFIX:-registry.cn-beijing.aliyuncs.com/jumpservice}/core:${JUMPSERVER_VERSION:-v5.1.1-ce}
    restart: "no"
    entrypoint: ["/bin/bash", "/opt/pigsty-init.sh"]
    command: []
    env_file:
      - .env
    environment:
      <<: *redis-client-env
    extra_hosts:
      - "redis:${REDIS_IP:-192.168.250.2}"
    volumes:
      - ./init.sh:/opt/pigsty-init.sh:ro
      - ${JUMPSERVER_DATA:-/data/jumpserver}/core/data:/opt/jumpserver/data
      - ${JUMPSERVER_DATA:-/data/jumpserver}/certs:/opt/jumpserver/data/certs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      net:
        ipv4_address: ${INIT_IP:-192.168.250.9}

  #--------------------------------------------------------------#
  # Core: Django API/web backend
  #--------------------------------------------------------------#
  core:
    container_name: jms_core
    hostname: jms_core
    image: ${IMAGE_PULL_PREFIX:-registry.cn-beijing.aliyuncs.com/jumpservice}/core:${JUMPSERVER_VERSION:-v5.1.1-ce}
    restart: unless-stopped
    command: start web
    ulimits:
      core: 0
    env_file:
      - .env
    environment:
      <<: *redis-client-env
      TIME_ZONE: ${TZ:-Asia/Shanghai}
    extra_hosts:
      - "redis:${REDIS_IP:-192.168.250.2}"
    volumes:
      - ${JUMPSERVER_DATA:-/data/jumpserver}/core/data:/opt/jumpserver/data
      - ${JUMPSERVER_DATA:-/data/jumpserver}/certs:/opt/jumpserver/data/certs
    depends_on:
      redis:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    healthcheck:
      test: "check http://localhost:8080/api/health/"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      net:
        ipv4_address: ${CORE_IP:-192.168.250.4}

  #--------------------------------------------------------------#
  # Celery: background tasks and scheduled jobs
  #--------------------------------------------------------------#
  celery:
    container_name: jms_celery
    hostname: jms_celery
    image: ${IMAGE_PULL_PREFIX:-registry.cn-beijing.aliyuncs.com/jumpservice}/core:${JUMPSERVER_VERSION:-v5.1.1-ce}
    restart: unless-stopped
    command: start task
    ulimits:
      core: 0
    env_file:
      - .env
    environment:
      <<: *redis-client-env
      LC_ALL: C.UTF-8
    extra_hosts:
      - "redis:${REDIS_IP:-192.168.250.2}"
    volumes:
      - ${JUMPSERVER_DATA:-/data/jumpserver}/core/data:/opt/jumpserver/data
      - ${JUMPSERVER_DATA:-/data/jumpserver}/certs:/opt/jumpserver/data/certs
    depends_on:
      redis:
        condition: service_healthy
      # Core and init complete migrations before task workers access the DB.
      core:
        condition: service_healthy
    healthcheck:
      test: "bash /opt/jumpserver/utils/check_celery.sh"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      net:
        ipv4_address: ${CELERY_IP:-192.168.250.3}

  #--------------------------------------------------------------#
  # Koko: SSH/SFTP terminal component
  #--------------------------------------------------------------#
  koko:
    container_name: jms_koko
    hostname: jms_koko
    image: ${IMAGE_PULL_PREFIX:-registry.cn-beijing.aliyuncs.com/jumpservice}/koko:${JUMPSERVER_VERSION:-v5.1.1-ce}
    restart: unless-stopped
    privileged: ${KOKO_PRIVILEGED:-true}
    ulimits:
      core: 0
    env_file:
      - .env
    environment:
      <<: *redis-client-env
      WEB_PROXY_BIND_HOST: 0.0.0.0
      WEB_PROXY_PORT: 5001
      WEB_PROXY_ALLOWED_HOSTS: ${WEB_PROXY_ALLOWED_HOSTS:-localhost,127.0.0.1}
    extra_hosts:
      - "core:${CORE_IP:-192.168.250.4}"
    ports:
      - "${SSH_PORT:-2222}:2222"
      - "${KOKO_WEB_PROXY_PORT:-5001}:5001"
    volumes:
      - ${JUMPSERVER_DATA:-/data/jumpserver}/koko/data:/opt/koko/data
      - ${JUMPSERVER_DATA:-/data/jumpserver}/certs:/opt/koko/data/certs
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: "check http://localhost:5000/koko/health/"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      net:
        ipv4_address: ${KOKO_IP:-192.168.250.7}

  #--------------------------------------------------------------#
  # Kael: AI gateway (part of the official 5.x Community Edition)
  #--------------------------------------------------------------#
  kael:
    container_name: jms_kael
    hostname: jms_kael
    image: ${IMAGE_PULL_PREFIX:-registry.cn-beijing.aliyuncs.com/jumpservice}/kael:${JUMPSERVER_VERSION:-v5.1.1-ce}
    restart: unless-stopped
    ulimits:
      core: 0
    env_file:
      - .env
    environment:
      # 5.1 forwards the user's Core session; no delegation key is needed.
      PLATFORM_GATEWAY_ENABLED: "true"
    extra_hosts:
      - "core:${CORE_IP:-192.168.250.4}"
    volumes:
      - ${JUMPSERVER_DATA:-/data/jumpserver}/kael/data:/opt/kael/data
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: "check http://localhost:8083/kael/health/ready"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      net:
        ipv4_address: ${KAEL_IP:-192.168.250.5}

  #--------------------------------------------------------------#
  # Chen: web database connector
  #--------------------------------------------------------------#
  chen:
    container_name: jms_chen
    hostname: jms_chen
    image: ${IMAGE_PULL_PREFIX:-registry.cn-beijing.aliyuncs.com/jumpservice}/chen:${JUMPSERVER_VERSION:-v5.1.1-ce}
    restart: unless-stopped
    ulimits:
      core: 0
    env_file:
      - .env
    environment:
      <<: *redis-client-env
    extra_hosts:
      - "core:${CORE_IP:-192.168.250.4}"
    volumes:
      - ${JUMPSERVER_DATA:-/data/jumpserver}/chen/data:/opt/chen/data
      - ${JUMPSERVER_DATA:-/data/jumpserver}/certs:/opt/chen/data/certs
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: "check http://localhost:8082/chen/healthy"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      net:
        ipv4_address: ${CHEN_IP:-192.168.250.6}

  #--------------------------------------------------------------#
  # Web: JumpServer web UI / reverse proxy
  #--------------------------------------------------------------#
  web:
    container_name: jms_web
    hostname: jms_web
    image: ${IMAGE_PULL_PREFIX:-registry.cn-beijing.aliyuncs.com/jumpservice}/web:${JUMPSERVER_VERSION:-v5.1.1-ce}
    restart: unless-stopped
    ulimits:
      core: 0
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      USE_LB: ${USE_LB:-1}
      USE_IPV6: ${USE_IPV6:-0}
      USE_XPACK: ${USE_XPACK:-0}
      GZIP: ${GZIP:-on}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-4096m}
      CORE_ENABLED: ${CORE_ENABLED:-1}
      KOKO_ENABLED: ${KOKO_ENABLED:-1}
      CHEN_ENABLED: ${CHEN_ENABLED:-1}
      KAEL_ENABLED: ${KAEL_ENABLED:-1}
      RAZOR_ENABLED: ${RAZOR_ENABLED:-0}
    extra_hosts:
      - "core:${CORE_IP:-192.168.250.4}"
      - "koko:${KOKO_IP:-192.168.250.7}"
      - "kael:${KAEL_IP:-192.168.250.5}"
      - "chen:${CHEN_IP:-192.168.250.6}"
    ports:
      # The official Web image listens on port 80; HTTP_PORT is the host port.
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ${JUMPSERVER_DATA:-/data/jumpserver}/core/data:/opt/jumpserver/data
      - ${JUMPSERVER_DATA:-/data/jumpserver}/nginx/data/logs:/var/log/nginx
    depends_on:
      core:
        condition: service_healthy
      koko:
        condition: service_healthy
      kael:
        condition: service_healthy
      chen:
        condition: service_healthy
    healthcheck:
      test: "check http://localhost:51980/web/health/"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      net:
        ipv4_address: ${WEB_IP:-192.168.250.8}

  #--------------------------------------------------------------#
  # Local Redis: cache, Celery broker, and Channels backend
  #--------------------------------------------------------------#
  redis:
    container_name: jms_redis
    hostname: redis
    image: redis:${REDIS_VERSION:-7.4.12-bookworm}
    restart: unless-stopped
    command: ["redis-server", "--port", "${REDIS_PORT:-6379}", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - ${JUMPSERVER_DATA:-/data/jumpserver}/redis/data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 -p \"$$REDIS_PORT\" ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      net:
        ipv4_address: ${REDIS_IP:-192.168.250.2}

networks:
  net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${DOCKER_SUBNET:-192.168.250.0/24}
...
