# Docker Registry Mirror for China Users
# Port: 5000 - Registry Service
# Port: 5080 - Registry Admin UI (optional)

services:
  registry:
    container_name: registry
    image: ${REGISTRY_IMAGE:-registry:3.1.2}
    restart: always
    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_LOG_LEVEL: ${REGISTRY_LOG_LEVEL:-info}
      REGISTRY_STORAGE_DELETE_ENABLED: ${REGISTRY_STORAGE_DELETE_ENABLED:-true}
      REGISTRY_PROXY_REMOTEURL: ${REGISTRY_PROXY_REMOTEURL:-https://registry-1.docker.io}
      REGISTRY_PROXY_TTL: ${REGISTRY_PROXY_TTL:-168h}
      HTTP_PROXY: ${REGISTRY_HTTP_PROXY:-}
      HTTPS_PROXY: ${REGISTRY_HTTPS_PROXY:-}
      NO_PROXY: ${REGISTRY_NO_PROXY:-localhost,127.0.0.1,registry}
    ports:
      - "${REGISTRY_PORT:-5000}:5000"
    volumes:
      - ${REGISTRY_DATA:-/data/registry}:/var/lib/registry
      - ./config.yml:/etc/docker/registry/config.yml:ro
    command: ["/etc/docker/registry/config.yml"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5000/v2/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Optional: Registry UI for management
  registry-ui:
    container_name: registry-ui
    image: ${REGISTRY_UI_IMAGE:-joxit/docker-registry-ui:2.6.0}
    restart: always
    environment:
      SINGLE_REGISTRY: true
      REGISTRY_TITLE: "Docker Registry Mirror"
      DELETE_IMAGES: true
      SHOW_CONTENT_DIGEST: true
      NGINX_PROXY_PASS_URL: http://registry:5000
      SHOW_CATALOG_NB_TAGS: true
      CATALOG_MIN_BRANCHES: 1
      CATALOG_MAX_BRANCHES: 1
      TAGLIST_PAGE_SIZE: 100
      REGISTRY_SECURED: false
      CATALOG_ELEMENTS_LIMIT: 1000
    ports:
      - "${REGISTRY_UI_PORT:-5080}:80"
    depends_on:
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider -T 2 http://127.0.0.1/ && wget -q --spider -T 2 http://127.0.0.1/v2/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
