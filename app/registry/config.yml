version: 0.1
log:
  fields:
    service: registry
  level: info

storage:
  cache:
    blobdescriptor: inmemory
  filesystem:
    rootdirectory: /var/lib/registry
  delete:
    enabled: true

http:
  addr: :5000
  headers:
    X-Content-Type-Options: [nosniff]
    Access-Control-Allow-Origin: ['*']
    Access-Control-Allow-Methods: ['HEAD', 'GET', 'OPTIONS', 'DELETE']
    Access-Control-Allow-Headers: ['Authorization', 'Accept', 'Cache-Control']
    Access-Control-Max-Age: [1728000]
    Access-Control-Allow-Credentials: [true]
    Access-Control-Expose-Headers: ['Docker-Content-Digest']

# Pull-through cache for one upstream registry.
proxy:
  remoteurl: https://registry-1.docker.io
  username: ~
  password: ~
  ttl: 168h

# Change remoteurl to select a different compatible upstream; this is not a
# multi-registry router. Docker daemon registry-mirrors apply to Docker Hub only.

# Internal storage-driver health checks (not a public HTTP endpoint)
health:
  storagedriver:
    enabled: true
    interval: 10s
    threshold: 3

# Optional: Authentication (uncomment if needed)
# auth:
#   htpasswd:
#     realm: basic-realm
#     path: /etc/docker/registry/htpasswd
