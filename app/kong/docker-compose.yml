# check .env files before running
services:

  # Kong: The API Gateway
  kong:
    container_name: kong
    image: kong:latest
    restart: always
    environment:
      KONG_DATABASE: ${KONG_DATABASE}
      KONG_PG_HOST: ${KONG_PG_HOST}
      KONG_PG_USER: ${KONG_PG_USER}
      KONG_PG_DATABASE: ${KONG_PG_DATABASE}
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD}

      KONG_PROXY_LISTEN: 0.0.0.0:${KONG_PORT}, 0.0.0.0:${KONG_PORT_SSL} ssl
      KONG_ADMIN_LISTEN: 0.0.0.0:${KONG_ADMIN_PORT}
    healthcheck:
      test: [ "CMD", "kong", "health" ]
      interval: 5s
      timeout: 2s
      retries: 15
    ports:
      - "${KONG_PORT}:${KONG_PORT}"
      - "${KONG_PORT_SSL}:${KONG_PORT_SSL}"
      - "127.0.0.1:${KONG_ADMIN_PORT}:${KONG_ADMIN_PORT}"

  # Kong database migration task
  kong-migration: # one time job
    image: kong:latest
    profiles: ["bootstrap"]
    command: "kong migrations bootstrap"
    restart: "no"
    environment:
      KONG_DATABASE: ${KONG_DATABASE}
      KONG_PG_HOST: ${KONG_PG_HOST}
      KONG_PG_USER: ${KONG_PG_USER}
      KONG_PG_DATABASE: ${KONG_PG_DATABASE}
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD}
