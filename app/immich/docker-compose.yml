#!/usr/bin/env docker compose
---
#==============================================================#
# File      :   docker-compose.yml
# Desc      :   Immich docker compose with Pigsty PostgreSQL
# Ctime     :   2026-07-04
# Mtime     :   2026-10-08
# Path      :   app/immich/docker-compose.yml
# Docs      :   https://pigsty.io/docs/app/immich
# Source    :   https://github.com/immich-app/immich/releases/download/v3.3.0/docker-compose.yml
# License   :   Apache-2.0 @ https://pigsty.io/docs/about/license/
# Copyright :   2018-2026  Ruohang Feng / Vonng (rh@vonng.com)
#==============================================================#

name: immich

services:

  #--------------------------------------------------------------#
  # Immich server: API, web UI, and background jobs
  #--------------------------------------------------------------#
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3}
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      REDIS_HOSTNAME: ${REDIS_HOSTNAME:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    ports:
      - '${IMMICH_HOST_PORT:-2283}:2283'
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      disable: false

  #--------------------------------------------------------------#
  # Immich machine learning service
  #--------------------------------------------------------------#
  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3}
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    environment:
      REDIS_HOSTNAME: ${REDIS_HOSTNAME:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    restart: always
    healthcheck:
      disable: false

  #--------------------------------------------------------------#
  # Local Valkey queue/cache for Immich background jobs
  #--------------------------------------------------------------#
  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    command: ["valkey-server", "--port", "${REDIS_PORT:-6379}"]
    environment:
      REDIS_PORT: ${REDIS_PORT:-6379}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p \"$$REDIS_PORT\" ping | grep -qx PONG"]
    restart: always

volumes:
  model-cache:
...
