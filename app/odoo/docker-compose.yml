# Copyright :   2018-2026  Ruohang Feng / Vonng (rh@vonng.com)
#==============================================================#
# Image:    https://hub.docker.com/_/odoo
# Tutorial: https://pigsty.io/docs/app/odoo


name: odoo
services:

  # the main odoo container
  odoo:
    container_name: odoo
    image: odoo:${ODOO_VERSION}
    restart: unless-stopped
    ports:
      - "${ODOO_PORT}:8069"
    environment:
      - PGHOST=${PG_HOST}
      - PGPORT=${PG_PORT}
      - PGUSER=${PG_USERNAME}
      - PGPASSWORD=${PG_PASSWORD}
      # Odoo 19 master password setting.
      - ODOO_ADMIN_PASSWD=${ODOO_ADMIN_PASSWORD}
      # Enable proxy mode for Nginx access.
      - ODOO_PROXY_MODE=${ODOO_PROXY_MODE:-false}
    volumes:
      - ${ODOO_DATA}:/var/lib/odoo
      - ${ODOO_ADDONS}:/mnt/extra-addons
      #- ./config:/etc/odoo
    command:
      - odoo
      - --database=${ODOO_DBNAME}
      # Use the exact database whitelist instead of a regex filter.
      - --db-filter=
      - --no-database-list
      - --http-interface=0.0.0.0

  # Run with `make init`; it propagates the initializer's exit status.
  odoo-init:
    image: odoo:${ODOO_VERSION}
    profiles: ["init"]
    command:
      - odoo
      - --stop-after-init
      - --init=base
      - --without-demo
      - --database=${ODOO_DBNAME}
      - --db-filter=
      - --no-database-list
      - --http-interface=0.0.0.0
    environment:
      - PGHOST=${PG_HOST}
      - PGPORT=${PG_PORT}
      - PGUSER=${PG_USERNAME}
      - PGPASSWORD=${PG_PASSWORD}
      - ODOO_ADMIN_PASSWD=${ODOO_ADMIN_PASSWORD}
    volumes:
      - ${ODOO_DATA}:/var/lib/odoo
      - ${ODOO_ADDONS}:/mnt/extra-addons
    restart: "no"
...
