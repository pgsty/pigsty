# Image:    https://hub.docker.com/_/odoo
# Tutorial: https://pigsty.io/docs/app/odoo


name: odoo
services:

  # the main odoo container
  odoo:
    container_name: odoo
    image: odoo:${ODOO_VERSION}
    restart: unless-stopped
    ports:
      - ${ODOO_PORT}:8069
    environment:
      - PGHOST=${PG_HOST}
      - PGPORT=${PG_PORT}
      - PGUSER=${PG_USERNAME}
      - PGPASSWORD=${PG_PASSWORD}
      # Odoo 19 reads this setting from the environment, not a CLI option.
      - ODOO_ADMIN_PASSWD=${ODOO_ADMIN_PASSWORD}
    volumes:
      - ${ODOO_DATA}:/var/lib/odoo
      - ${ODOO_ADDONS}:/mnt/extra-addons
      #- ./config:/etc/odoo
    command:
      - odoo
      - --database=${ODOO_DBNAME}
      # Empty dbfilter makes Odoo use the exact --database whitelist.
      # A database name is a literal identifier, not a regular expression.
      - --db-filter=
      - --no-database-list
      - --http-interface=0.0.0.0

  # Run with `make init`; it propagates the initializer's exit status.
  odoo-init:
    image: odoo:${ODOO_VERSION}
    profiles: ["init"]
    command:
      - odoo
      - --stop-after-init
      - --init=base
      - --without-demo
      - --database=${ODOO_DBNAME}
      - --db-filter=
      - --no-database-list
      - --http-interface=0.0.0.0
    environment:
      - PGHOST=${PG_HOST}
      - PGPORT=${PG_PORT}
      - PGUSER=${PG_USERNAME}
      - PGPASSWORD=${PG_PASSWORD}
      - ODOO_ADMIN_PASSWD=${ODOO_ADMIN_PASSWORD}
    volumes:
      - ${ODOO_DATA}:/var/lib/odoo
      - ${ODOO_ADDONS}:/mnt/extra-addons
    restart: "no"
...
