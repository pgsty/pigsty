# Enable Supabase asymmetric JWT verification and opaque API keys.
# Populate all key variables in .env, then add this override to docker compose.

services:
  api-gw:
    environment:
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?SUPABASE_PUBLISHABLE_KEY is required for opaque API keys}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?SUPABASE_SECRET_KEY is required for opaque API keys}
      ANON_KEY_ASYMMETRIC: ${ANON_KEY_ASYMMETRIC:?ANON_KEY_ASYMMETRIC is required for opaque API keys}
      SERVICE_ROLE_KEY_ASYMMETRIC: ${SERVICE_ROLE_KEY_ASYMMETRIC:?SERVICE_ROLE_KEY_ASYMMETRIC is required for opaque API keys}

  auth:
    environment:
      GOTRUE_JWT_KEYS: ${JWT_KEYS:?JWT_KEYS is required for asymmetric auth}

  realtime:
    environment:
      API_JWT_JWKS: ${JWT_JWKS:?JWT_JWKS is required for asymmetric auth}

  storage:
    environment:
      JWT_JWKS: ${JWT_JWKS:?JWT_JWKS is required for asymmetric auth}
