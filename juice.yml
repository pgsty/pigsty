#!/usr/bin/env ansible-playbook
---
#==============================================================#
# File      :   juice.yml
# Desc      :   Deploy JuiceFS distributed filesystem
# Ctime     :   2025-01-20
# Mtime     :   2026-11-10
# Path      :   juice.yml
# Docs      :   https://pigsty.io/docs/juice/
# License   :   Apache-2.0
# Copyright :   2018-2026  Ruohang Feng / Vonng (rh@vonng.com)
#==============================================================#
- name: JUICE
  hosts: all
  become: yes
  gather_facts: no
  pre_tasks: [ { name: skip hosts without juice instances ,meta: end_host ,when: juice_instances is not defined or juice_instances|length == 0 ,tags: always } ]
  roles:
    - { role: node_id, tags: id }
    - { role: juice,   tags: juice }

#--------------------------------------------------------------#
# Usage
#--------------------------------------------------------------#
# https://juicefs.com/docs/community/command_reference
#
# juice_cache: /data/juice                # shared cache directory
# juice_instances:                        # dict of juicefs filesystems
#   <name>:                               # fs name (key)
#     path  : /pgfs                       # [REQUIRED] mountpoint
#     meta  : postgres://u:p@h:5432/db    # [REQUIRED] metadata URL
#     data  : --storage postgres ...      # format options
#     unit  : juicefs-<name>              # service name
#     mount : ''                          # mount options
#     port  : 9567                        # metrics port (UNIQUE per instance!)
#     owner : root                        # fs root owner, set after mount
#     group : root                        # fs root group, set after mount
#     mode  : '0755'                      # fs root mode, set after mount
#     state : create                      # create | absent
#--------------------------------------------------------------#
# Deploy
#--------------------------------------------------------------#
#   ./juice.yml -l <host>                 # all fs on host
#   ./juice.yml -l <host> -e fsname=xxx   # single fs
#--------------------------------------------------------------#
# Reconfigure (running instances are NOT restarted)
#--------------------------------------------------------------#
#   ./juice.yml -l <host> -t juice_config,juice_launch  # render & daemon-reload
#   systemctl restart juicefs-<name>                    # apply on your own
#--------------------------------------------------------------#
# Remove (set state: absent in config first)
#--------------------------------------------------------------#
#   ./juice.yml -l <host> -t juice_clean
#   ./juice.yml -l <host> -e fsname=xxx -t juice_clean
# metadata and file data are never touched by removal
#--------------------------------------------------------------#
# Tags
#--------------------------------------------------------------#
#   juice_id       : validate names, required fields, port & path conflicts
#   juice_install  : install juicefs package
#   juice_cache    : create cache directory
#   juice_clean    : remove instances (state=absent), refresh targets
#   juice_instance : create instances (state=create)
#     juice_init   : format filesystem
#     juice_config : render service files (no restart)
#     juice_launch : start service and wait for mountpoint
#     juice_dir    : set mountpoint owner and mode (after mount)
#   juice_register : register to victoria
#--------------------------------------------------------------#
...
