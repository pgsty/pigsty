#==============================================================#
# File      :   docker.yml
# Desc      :   Build and push Docker images to Docker Hub
# Ctime     :   2025-01-27
# Mtime     :   2026-08-12
# License   :   Apache-2.0 @ https://pigsty.io/docs/about/license
# Copyright :   2018-2025  Ruohang Feng / Vonng (rh@vonng.com)
#==============================================================#
#
# This workflow builds multi-architecture Docker images (amd64/arm64)
# and pushes them to Docker Hub under pgsty/pigsty.
#
# Trigger:
#   - Pull requests validate the image on amd64 and arm64 without publishing
#   - Manual workflow_dispatch publishes a release tag
#
# Required secrets:
#   - DOCKERHUB_USERNAME: Docker Hub username
#   - DOCKERHUB_TOKEN: Docker Hub access token (not password)
#
# Images produced:
#   - pgsty/pigsty:v4.5.0 (version tag)
#   - pgsty/pigsty:latest (when push_latest is enabled)
#
#==============================================================#

name: Publish Docker Image

run-name: "Docker Image ${{ inputs.version || format('PR #{0}', github.event.pull_request.number) }}"

on:
  pull_request:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v4.5.0)'
        required: true
        default: 'v4.5.0'
      push_latest:
        description: 'Also tag as latest?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  REGISTRY: docker.io
  IMAGE_NAME: pgsty/pigsty

permissions: read-all

concurrency:
  group: docker-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.version }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      #--------------------------------------------------------------#
      # Preparation
      #--------------------------------------------------------------#
      - name: Validate version tag
        env:
          VERSION: ${{ inputs.version || 'v4.5.0' }}
        run: |
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Invalid version tag: ${VERSION}" >&2
            echo "Expected vX.Y.Z or vX.Y.Z-suffix (for example, v4.5.0 or v4.5.0-rc.1)." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.sha }}

      - name: Extract version from input
        id: version
        env:
          VERSION: ${{ inputs.version || 'v4.5.0' }}
          PUSH_LATEST: ${{ inputs.push_latest || 'false' }}
        run: |
          VERSION_NUM="${VERSION#v}"

          {
            echo "version=${VERSION}"
            echo "version_num=${VERSION_NUM}"
            echo "push_latest=${PUSH_LATEST}"
          } >> "${GITHUB_OUTPUT}"

          echo "Version: ${VERSION}"
          echo "Version Number: ${VERSION_NUM}"
          echo "Push Latest: ${PUSH_LATEST}"

      #--------------------------------------------------------------#
      # Docker Setup
      #--------------------------------------------------------------#
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      #--------------------------------------------------------------#
      # Build Metadata
      #--------------------------------------------------------------#
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            # Latest tag (only when push_latest is true)
            type=raw,value=latest,enable=${{ steps.version.outputs.push_latest == 'true' }}
          labels: |
            org.opencontainers.image.title=Pigsty
            org.opencontainers.image.description=Pigsty - PostgreSQL in Great STYle
            org.opencontainers.image.url=https://pigsty.io
            org.opencontainers.image.source=https://github.com/pgsty/pigsty
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.vendor=pgsty
            org.opencontainers.image.licenses=Apache-2.0
            maintainer=Ruohang Feng <rh@vonng.com>

      #--------------------------------------------------------------#
      # Build and Push
      #--------------------------------------------------------------#
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./docker
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version_num }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      #--------------------------------------------------------------#
      # Verification
      #--------------------------------------------------------------#
      - name: Inspect image
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Inspecting pushed images..."
          docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}

      - name: Summary
        if: github.event_name == 'workflow_dispatch'
        run: |
          {
            echo "## Docker Image Published"
            echo ""
            echo "**Images:**"
            echo "- \`${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}\`"
            if [ "${{ steps.version.outputs.push_latest }}" = "true" ]; then
              echo "- \`${{ env.IMAGE_NAME }}:latest\`"
            fi
            echo ""
            echo "**Platforms:** linux/amd64, linux/arm64"
            echo ""
            echo "**Pull command:**"
            echo "\`\`\`bash"
            echo "docker pull ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
