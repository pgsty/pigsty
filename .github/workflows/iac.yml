name: IaC Templates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iac.yml'
      - '.opentofu-version'
      - 'Makefile'
      - 'terraform/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/iac.yml'
      - '.opentofu-version'
      - 'Makefile'
      - 'terraform/**'
  workflow_dispatch:

permissions: read-all

jobs:
  opentofu:
    name: OpenTofu
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: 'true'
      TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tofu-plugin-cache
      TF_PROVIDER_DOWNLOAD_RETRY: '5'
      TF_REGISTRY_CLIENT_TIMEOUT: '30'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false

      - name: Prepare provider cache
        run: mkdir -p "${TF_PLUGIN_CACHE_DIR}"

      - name: Validate every template
        run: ./terraform/check validate

  terraform-compat:
    name: Terraform compatibility
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: 'true'
      TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/terraform-plugin-cache
      TF_REGISTRY_CLIENT_TIMEOUT: '30'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: Prepare provider cache
        run: mkdir -p "${TF_PLUGIN_CACHE_DIR}"

      - name: Validate every template
        env:
          IAC_CLI: terraform
        run: ./terraform/check validate
