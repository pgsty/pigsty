#!/usr/bin/env ansible-playbook
---
#==============================================================#
# File      :   mysql-rm.yml
# Desc      :   remove mysql instance/cluster from pigsty
# Ctime     :   2026-07-17
# Mtime     :   2026-11-10
# Path      :   mysql-rm.yml
# Docs      :   https://pigsty.io/docs/mysql
# License   :   Apache-2.0 @ https://pigsty.io/docs/about/license/
# Copyright :   2018-2026  Ruohang Feng / Vonng (rh@vonng.com)
#==============================================================#
- name: MYSQL REMOVE
  become: true
  hosts: all
  gather_facts: no
  any_errors_fatal: true
  pre_tasks:
    - name: require an explicit mysql remove limit
      connection: local
      run_once: true
      tags: always
      assert:
        that: ansible_limit is defined and ansible_limit | trim | length > 0
        fail_msg: mysql-rm.yml requires an explicit -l/--limit target
  roles:
    - { role: mysql_remove ,tags: mysql_remove } # remove mysql instance/cluster


#--------------------------------------------------------------#
# Usage
#--------------------------------------------------------------#
#  Remove a standalone or a complete HA cluster:
#     ./mysql-rm.yml -l <cluster> -e mysql_safeguard=false
#         -e mysql_rm_data=true      # remove data, config and router state (default)
#         -e mysql_rm_data=false     # stop only; ./mysql.yml brings the cluster back
#         -e mysql_rm_pkg=true       # also uninstall mysql packages
#
#  Remove one member from an HA cluster:
#     ./mysql-rm.yml -l <ip> -e mysql_safeguard=false
#  The member leaves through a surviving member: a PRIMARY hands over first.
#  Pigsty runs MySQL with one or three members, so re-create the member next:
#  ./mysql.yml -l <cluster> clones it back on the same or a replaced machine.
#
#  It aborts unless mysql_safeguard is false, and always needs -l.
#  Backups under mysql_backup_dir are never removed.
#--------------------------------------------------------------#
# Tasks
#--------------------------------------------------------------#
# mysql_safeguard     : assert identity and abort if safeguard is enabled
# mysql_leave         : detach a single member through a surviving member
# mysql_deregister    : remove VictoriaMetrics targets
# mysql               : stop router, exporter, backup units and mysqld
# mysql_data          : remove data, config, secrets and router state
# mysql_pkg           : uninstall mysql packages
#--------------------------------------------------------------#
...
