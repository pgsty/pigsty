---
#--------------------------------------------------------------#
# Create etcd user for PG cluster                      [pg_etcd]
#--------------------------------------------------------------#
- name: validate etcd identity
  assert:
    that:
      - (pg_shard if pg_mode == 'citus' else pg_cluster) != 'root'
      # etcdctl user passwd reads a whitespace-delimited token from stdin.
      - pg_etcd_password is not none and (pg_etcd_password | string | regex_search('\s')) is none
    fail_msg: root is reserved for etcd administration; pg_etcd_password must not be null or contain whitespace

- name: ensure etcd user and role for pg cluster
  delegate_to: "{{ groups['etcd'] | first }}"
  throttle: 1
  environment:
    ETCDCTL_ENDPOINTS: "{{ groups['etcd'] | map('regex_replace', '^(.*)$', 'https://\\1:' + etcd_port|string) | join(',') }}"
    ETCDCTL_CACERT: "/etc/etcd/ca.crt"
    ETCDCTL_CERT: "/etc/etcd/server.crt"
    ETCDCTL_KEY: "/etc/etcd/server.key"
    ETCDCTL_USER: "root:{{ etcd_root_password }}"
    PG_ETCD_USERNAME: "{{ _etcd_user }}"
    PG_ETCD_PASSWORD: "{{ _etcd_pass }}"
    PG_ETCD_KEY_PREFIX: "{{ pg_namespace }}/{{ _etcd_user }}/"
  vars:
    _etcd_user: "{{ pg_shard if pg_mode == 'citus' else pg_cluster }}"
    _etcd_pass: "{{ pg_etcd_password | default(pg_shard if pg_mode == 'citus' else pg_cluster, true) }}"
  shell: |
    set -euo pipefail

    # ensure role and prefix permission
    if ! etcdctl role get "${PG_ETCD_USERNAME}" >/dev/null 2>&1; then
      etcdctl role add "${PG_ETCD_USERNAME}"
    fi
    etcdctl role grant-permission "${PG_ETCD_USERNAME}" --prefix=true readwrite "${PG_ETCD_KEY_PREFIX}"

    # serialize auth changes, including Citus primaries sharing one identity
    if etcdctl user get "${PG_ETCD_USERNAME}" >/dev/null 2>&1; then
      printf '%s\n' "${PG_ETCD_PASSWORD}" | etcdctl user passwd "${PG_ETCD_USERNAME}" --interactive=false
    else
      printf '%s\n' "${PG_ETCD_PASSWORD}" |
        etcdctl user add "${PG_ETCD_USERNAME}" --interactive=false
    fi

    # verify the cluster identity can actually read its Patroni namespace
    etcdctl user grant-role "${PG_ETCD_USERNAME}" "${PG_ETCD_USERNAME}"
    ETCDCTL_USER="${PG_ETCD_USERNAME}:${PG_ETCD_PASSWORD}" \
      etcdctl get "${PG_ETCD_KEY_PREFIX}" --prefix --keys-only --limit=1 >/dev/null
  args: { executable: /bin/bash }
  register: pg_etcd_auth_result
  retries: 5
  delay: 2
  until: pg_etcd_auth_result.rc == 0
  no_log: true
...
