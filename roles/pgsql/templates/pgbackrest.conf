#==============================================================#
# File      :   pgbackrest.conf
# Desc      :   PgBackrest Config for {{ pg_instance }} {{ pg_role }}
# Time      :   {{ '%Y-%m-%d %H:%M' | strftime }}
# Host      :   {{ pg_instance }} @ {{ inventory_hostname }}:{{ pg_port }}
# Path      :   /etc/pgbackrest/pgbackrest.conf
# Note      :   ANSIBLE MANAGED, DO NOT CHANGE!
# License   :   Apache-2.0 @ https://pigsty.io/docs/about/license/
# Copyright :   2018-2026  Ruohang Feng / Vonng (rh@vonng.com)
#==============================================================#


#--------------------------------------------------------------#
# 1. stanza
#--------------------------------------------------------------#
[{{ pg_cluster }}]
pg1-path={{ pg_data }}
pg1-port={{ pg_port }}
{%if pg_mode|default('pgsql') == 'ivory' %}
archive-header-check=n
{% endif %}
{% if pg_mode|default('pgsql') in ['agens', 'ivory'] %}
# These forks add fields to PostgreSQL's control file while retaining the
# upstream-compatible layout. Force the compatible PostgreSQL major version.
pg-version-force={{ pg_version|default(18) }}
{% endif %}
{% if pg_mode|default('pgsql') == 'agens' %}
# AG_VERSION files under base/<oid>/ are metadata, not PostgreSQL data pages.
# Disable page checksum validation while creating a backup so these files are
# not recorded as invalid pages in the backup manifest. File/manifest checksums
# and WAL checks remain enabled; existing affected backups must be recreated.
checksum-page=n
{% endif %}

#--------------------------------------------------------------#
# 2. archive
#--------------------------------------------------------------#
[global]
archive-async=y
archive-push-queue-max=4GiB

#--------------------------------------------------------------#
# 3. backup
#--------------------------------------------------------------#
annotation=pg_cluster={{ pg_cluster }}
expire-auto=y
start-fast=y
#archive-copy=n

#--------------------------------------------------------------#
# 4. general
#--------------------------------------------------------------#
compress-type=zst
spool-path=/pg/spool

#--------------------------------------------------------------#
# 5. log
#--------------------------------------------------------------#
log-path={{ pgbackrest_log_dir }}
log-level-file=info
log-level-console=info
#--------------------------------------------------------------#
# 6. maintainer
#--------------------------------------------------------------#

#--------------------------------------------------------------#
# 7. repository                                                #
#--------------------------------------------------------------#
{% for k,v in pgbackrest_repo[pgbackrest_method].items() %}
repo1-{{ k|replace('_', '-') }}={{ v|replace('${pg_cluster}', pg_cluster) }}
{% endfor %}


#--------------------------------------------------------------#
# 8. restore
#--------------------------------------------------------------#
# archive-mode is intentionally NOT set here
# For disaster recovery (new primary): use default (archive enabled)
# For test/dev restore: add --archive-mode=off on command line
# For exploratory PITR: add --archive-mode=off until correct point found
delta=y

#--------------------------------------------------------------#
# 9. server
#--------------------------------------------------------------#
#tls-server-address=*
#tls-server-port=9638
#tls-server-ca-file=/pg/cert/ca.crt
#tls-server-cert-file=/pg/cert/server.crt
#tls-server-key-file=/pg/cert/server.key

#--------------------------------------------------------------#
# 10. adhoc (parallel)
#--------------------------------------------------------------#
[global:backup]
{% if pg_mode|default('pgsql') == 'polar' %}
# PolarDB can leave the backup-end record in the active WAL segment.
# Wait longer than PostgreSQL's 300s archive_timeout for it to be archived.
archive-timeout=600
{% endif %}
# 1/4, least 2, max 4
process-max={{ ([ ([ (node_cpu | int / 4) | round(0, 'ceil'), 2 ]) | max, 4 ]) | min | int }}

{% if pg_mode|default('pgsql') == 'polar' %}
[global:check]
archive-timeout=600
{% endif %}

[global:restore]
# use full cpu, max 8
process-max={{ ([ node_cpu | int, 8 ]) | min | int }}

[global:archive-get]
# 1/4, least 2, max 4
process-max={{ ([ ([ (node_cpu | int / 4) | round(0, 'ceil'), 2 ]) | max, 4 ]) | min | int }}

[global:archive-push]
# async push with 1 / 4
process-max={{ ([ ([ (node_cpu | int / 4) | round(0, 'ceil'), 2 ]) | max, 4 ]) | min | int }}
