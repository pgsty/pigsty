---
#--------------------------------------------------------------#
# JUPYTER - JupyterLab Installation & Configuration
#--------------------------------------------------------------#

#--------------------------------------------------------------#
# jupyter_install - install jupyter if not exists
#--------------------------------------------------------------#
- name: install jupyter with uv if not exists
  tags: jupyter_install
  environment: "{{ proxy_env | default({}) }}"
  shell: |
    [ -x {{ (jupyter_venv ~ '/bin/python') | quote }} ] || uv venv {{ jupyter_venv | quote }}
    uv pip install --python {{ (jupyter_venv ~ '/bin/python') | quote }} jupyterlab ipykernel
  args:
    executable: /bin/bash
    creates: "{{ jupyter_venv }}/bin/jupyter"
  register: jupyter_install_result

#--------------------------------------------------------------#
# jupyter_dir - create jupyter data directory
#--------------------------------------------------------------#
- name: create jupyter data directory
  tags: jupyter_dir
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ node_user | default('root') }}"
    mode: '0755'
  loop:
    - "{{ vibe_data }}"
    - "{{ jupyter_data }}"

#--------------------------------------------------------------#
# jupyter_config - render jupyter config files
#--------------------------------------------------------------#
- name: render jupyter config file
  tags: jupyter_config
  template:
    src: jupyter_config.py
    dest: "{{ jupyter_data }}/jupyter_config.py"
    owner: "{{ node_user | default('root') }}"
    mode: '0600'
  register: jupyter_config_result

- name: render jupyter systemd service
  tags: jupyter_config
  template:
    src: jupyter.svc
    dest: /etc/systemd/system/jupyter.service
    mode: '0644'
  register: jupyter_service_result

- name: render jupyter environment file
  tags: jupyter_config
  template:
    src: jupyter.env
    dest: /etc/default/jupyter
    mode: '0644'
  register: jupyter_env_result

#--------------------------------------------------------------#
# jupyter_launch - start jupyter service
#--------------------------------------------------------------#
- name: start jupyter service
  tags: jupyter_launch
  systemd:
    name: jupyter
    state: >-
      {{ 'restarted' if
         (jupyter_install_result.changed | default(false)
          or jupyter_config_result.changed | default(false)
          or jupyter_service_result.changed | default(false)
          or jupyter_env_result.changed | default(false))
         else 'started' }}
    enabled: yes
    daemon_reload: yes

- name: wait for jupyter to be ready
  tags: jupyter_launch
  wait_for:
    host: 127.0.0.1
    port: "{{ jupyter_port }}"
    state: started
    timeout: 30

...
