---
#-----------------------------------------------------------------
# VAULT_REMOVE
#-----------------------------------------------------------------
# NOTE: unlike other *_remove roles, the safeguard defaults to TRUE.
# Destroying vault destroys the keys of pg_tde clusters & kes objects:
# the encrypted data AND all its backups become permanently unreadable.
vault_safeguard: true             # prevents purging vault instance? true by default
vault_rm_data: true               # purging vault data & config? true by default
vault_rm_pkg: false               # uninstall openbao package? false by default

#-----------------------------------------------------------------
# VAULT (REFERENCE)
#-----------------------------------------------------------------
vault_cluster: vault              # vault cluster name, vault by default
vault_data: /data/vault           # vault data dir: raft storage & snapshots
vault_port: 8200                  # vault api port, raft cluster port is +1
...
