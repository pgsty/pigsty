# {{ ansible_managed }}
# beta.pigsty.cc repository reverse proxy and bounded cache.

proxy_cache_path {{ upstream.cache_dir | default('/data/beta') }}
    levels=1:2 keys_zone=beta_cache:64m
    max_size=80g inactive=30d min_free=100g use_temp_path=off;

server {
    listen {{ nginx_port | default(80) }};
    server_name {{ upstream.domain }};

    location ^~ /.well-known/acme-challenge/ {
        root {{ nginx_home | default('/www') }}/acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen {{ nginx_ssl_port | default(443) }} ssl;
    http2 on;
    server_name {{ upstream.domain }};

    ssl_certificate     {% if upstream.cert is defined %}{{ upstream.cert }}{% else %}/etc/nginx/conf.d/cert/{{ upstream.domain }}.crt{% endif %};
    ssl_certificate_key {% if upstream.key is defined %}{{ upstream.key }}{% else %}/etc/nginx/conf.d/cert/{{ upstream.domain }}.key{% endif %};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/{{ upstream.log | default('beta.log') }};
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

    set $repo_origin            repo.pigsty.io;
    set $pgdg_yum_origin        download.postgresql.org;
    set $pgdg_apt_origin        apt.postgresql.org;
    set $rocky_origin           dl.rockylinux.org;
    set $kernel_origin          mirrors.edge.kernel.org;
    set $debian_origin          deb.debian.org;
    set $debian_security_origin security.debian.org;
    set $ubuntu_ports_origin    ports.ubuntu.com;
    set $docker_origin          download.docker.com;

    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
    proxy_cache beta_cache;
    proxy_cache_lock on;
    proxy_cache_revalidate on;
    proxy_cache_background_update on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_valid 200 30m;
    proxy_cache_valid 404 1m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    add_header X-Cache-Status $upstream_cache_status always;

    location ~ ^/yum/pgdg/(?<pgdg_yum_path>.*)$ {
        limit_except GET HEAD { deny all; }
        proxy_pass https://$pgdg_yum_origin/pub/repos/yum/$pgdg_yum_path$is_args$args;
        proxy_ssl_name download.postgresql.org;
        proxy_set_header Host download.postgresql.org;
        proxy_redirect https://download.postgresql.org/pub/repos/yum/ /yum/pgdg/;
        proxy_cache_key "download.postgresql.org|/pub/repos/yum/$pgdg_yum_path$is_args$args";
    }

    location ~ ^/apt/pgdg/(?<pgdg_apt_path>.*)$ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://$pgdg_apt_origin/pub/repos/apt/$pgdg_apt_path$is_args$args;
        proxy_set_header Host apt.postgresql.org;
        proxy_redirect http://apt.postgresql.org/pub/repos/apt/ /apt/pgdg/;
        proxy_redirect https://apt.postgresql.org/pub/repos/apt/ /apt/pgdg/;
        proxy_cache_key "apt.postgresql.org|/pub/repos/apt/$pgdg_apt_path$is_args$args";
    }

    location ~ ^/yum/linux/rocky/(?<rocky_path>.*)$ {
        limit_except GET HEAD { deny all; }
        proxy_pass https://$rocky_origin/pub/rocky/$rocky_path$is_args$args;
        proxy_ssl_name dl.rockylinux.org;
        proxy_set_header Host dl.rockylinux.org;
        proxy_redirect https://dl.rockylinux.org/pub/rocky/ /yum/linux/rocky/;
        proxy_redirect http://dl.rockylinux.org/pub/rocky/ /yum/linux/rocky/;
        proxy_cache_key "dl.rockylinux.org|/pub/rocky/$rocky_path$is_args$args";
    }

    location ~ ^/yum/linux/epel/(?<epel_path>.*)$ {
        limit_except GET HEAD { deny all; }
        proxy_pass https://$kernel_origin/fedora-epel/$epel_path$is_args$args;
        proxy_ssl_name mirrors.edge.kernel.org;
        proxy_set_header Host mirrors.edge.kernel.org;
        proxy_redirect https://mirrors.edge.kernel.org/fedora-epel/ /yum/linux/epel/;
        proxy_redirect http://mirrors.edge.kernel.org/fedora-epel/ /yum/linux/epel/;
        proxy_cache_key "mirrors.edge.kernel.org|/fedora-epel/$epel_path$is_args$args";
    }

    location ~ ^/apt/linux/debian/(?<debian_path>.*)$ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://$debian_origin/debian/$debian_path$is_args$args;
        proxy_set_header Host deb.debian.org;
        proxy_redirect http://deb.debian.org/debian/ /apt/linux/debian/;
        proxy_redirect https://deb.debian.org/debian/ /apt/linux/debian/;
        proxy_cache_key "deb.debian.org|/debian/$debian_path$is_args$args";
    }

    location ~ ^/apt/linux/debian-security/(?<debian_security_path>.*)$ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://$debian_security_origin/debian-security/$debian_security_path$is_args$args;
        proxy_set_header Host security.debian.org;
        proxy_redirect http://security.debian.org/debian-security/ /apt/linux/debian-security/;
        proxy_redirect https://security.debian.org/debian-security/ /apt/linux/debian-security/;
        proxy_cache_key "security.debian.org|/debian-security/$debian_security_path$is_args$args";
    }

    location ~ ^/apt/linux/ubuntu/(?<ubuntu_path>.*)$ {
        limit_except GET HEAD { deny all; }
        proxy_pass https://$kernel_origin/ubuntu/$ubuntu_path$is_args$args;
        proxy_ssl_name mirrors.edge.kernel.org;
        proxy_set_header Host mirrors.edge.kernel.org;
        proxy_redirect https://mirrors.edge.kernel.org/ubuntu/ /apt/linux/ubuntu/;
        proxy_redirect http://mirrors.edge.kernel.org/ubuntu/ /apt/linux/ubuntu/;
        proxy_cache_key "mirrors.edge.kernel.org|/ubuntu/$ubuntu_path$is_args$args";
    }

    location ~ ^/apt/linux/ubuntu-ports/(?<ubuntu_ports_path>.*)$ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://$ubuntu_ports_origin/ubuntu-ports/$ubuntu_ports_path$is_args$args;
        proxy_set_header Host ports.ubuntu.com;
        proxy_redirect http://ports.ubuntu.com/ubuntu-ports/ /apt/linux/ubuntu-ports/;
        proxy_redirect https://ports.ubuntu.com/ubuntu-ports/ /apt/linux/ubuntu-ports/;
        proxy_cache_key "ports.ubuntu.com|/ubuntu-ports/$ubuntu_ports_path$is_args$args";
    }

    location ~ ^/yum/docker/(?<docker_yum_path>.*)$ {
        limit_except GET HEAD { deny all; }
        proxy_pass https://$docker_origin/linux/centos/$docker_yum_path$is_args$args;
        proxy_ssl_name download.docker.com;
        proxy_set_header Host download.docker.com;
        proxy_redirect https://download.docker.com/linux/centos/ /yum/docker/;
        proxy_redirect http://download.docker.com/linux/centos/ /yum/docker/;
        proxy_cache_key "download.docker.com|/linux/centos/$docker_yum_path$is_args$args";
    }

    location ~ ^/apt/docker/(?<docker_apt_distro>debian|ubuntu)/(?<docker_apt_path>.*)$ {
        limit_except GET HEAD { deny all; }
        proxy_pass https://$docker_origin/linux/$docker_apt_distro/$docker_apt_path$is_args$args;
        proxy_ssl_name download.docker.com;
        proxy_set_header Host download.docker.com;
        proxy_redirect https://download.docker.com/linux/debian/ /apt/docker/debian/;
        proxy_redirect http://download.docker.com/linux/debian/ /apt/docker/debian/;
        proxy_redirect https://download.docker.com/linux/ubuntu/ /apt/docker/ubuntu/;
        proxy_redirect http://download.docker.com/linux/ubuntu/ /apt/docker/ubuntu/;
        proxy_cache_key "download.docker.com|/linux/$docker_apt_distro/$docker_apt_path$is_args$args";
    }

    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass https://$repo_origin$request_uri;
        proxy_ssl_name repo.pigsty.io;
        proxy_set_header Host repo.pigsty.io;
        proxy_cache_key "repo.pigsty.io|$request_uri";
        proxy_cache_valid 200 301 302 1h;
        proxy_cache_valid 404 5m;
    }
}
