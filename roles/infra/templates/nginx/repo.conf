# {{ ansible_managed }}
# Public Pigsty repository with an explicit publication allowlist.

# Reject unknown HTTP Host values and TLS SNI names.
server {
    listen {{ nginx_port | default(80) }} default_server;
    server_name _;
    return 444;
}

server {
    listen {{ nginx_ssl_port | default(443) }} ssl default_server;
    ssl_reject_handshake on;
}

# Nginx exporter endpoint.  It is reachable only over loopback.
server {
    listen 127.0.0.1:{{ nginx_status_port | default(9180) }};
    server_name localhost;

    location = /nginx {
        stub_status;
        access_log off;
    }

    location / {
        return 404;
    }
}

server {
    listen {{ nginx_port | default(80) }};
    server_name {{ upstream.domain }};

    location ^~ /.well-known/acme-challenge/ {
        root {{ nginx_home | default('/www') }}/acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen {{ nginx_ssl_port | default(443) }} ssl;
    http2 on;
    server_name {{ upstream.domain }};

    ssl_certificate     {% if upstream.cert is defined %}{{ upstream.cert }}{% else %}/etc/nginx/conf.d/cert/{{ upstream.domain }}.crt{% endif %};
    ssl_certificate_key {% if upstream.key is defined %}{{ upstream.key }}{% else %}/etc/nginx/conf.d/cert/{{ upstream.domain }}.key{% endif %};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/{{ upstream.log | default('repo.log') }};
    root {{ upstream.path | default('/data/nginx/repo') }};

    location ^~ /.well-known/acme-challenge/ {
        root {{ nginx_home | default('/www') }}/acme;
        try_files $uri =404;
    }

    # Never publish repository metadata, editor state, or scratch trees.
    location ~ (^|/)\. {
        return 404;
    }

    location ~ ^/(tmp|data|bin|docs|docker|pro)(/|$) {
        return 404;
    }

    # Public repository trees.  Directory indexes remain disabled; clients
    # fetch exact metadata and artifact paths.
    location ~ ^/(apt|yum|rpm|pkg|src|img|dba|etc|ext)(/|$) {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }

    location ~ ^/(get|pig|key|ray|beta|README\.md|pev\.html)$ {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
