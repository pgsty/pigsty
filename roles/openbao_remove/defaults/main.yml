---
#-----------------------------------------------------------------
# OPENBAO_REMOVE
#-----------------------------------------------------------------
# NOTE: unlike the other *_remove roles, the safeguard defaults to TRUE.
# Destroying an openbao cluster destroys the principal keys held for
# pg_tde: the encrypted PostgreSQL data and its backups become
# permanently unreadable. Removal must be an explicit, deliberate act.
openbao_safeguard: true           # prevents purging openbao instance? true by default
openbao_rm_data: true             # purging openbao data and config? true by default
openbao_rm_log: true              # purging openbao log dir (holds the audit trail)? true by default
openbao_rm_pkg: false             # uninstall openbao packages? false by default

#-----------------------------------------------------------------
# OPENBAO (REFERENCE)
#-----------------------------------------------------------------
openbao_cluster: openbao          # bao cluster & group name, openbao by default
openbao_data: /data/openbao       # bao data dir, `/data/openbao` by default
openbao_log_dir: /data/openbao/log # bao log dir, `/data/openbao/log` by default
openbao_api_port: 8200            # bao api port, 8200 by default
...
