---
#-----------------------------------------------------------------
# MYSQL_IDENTITY
#-----------------------------------------------------------------
# mysql_cluster:       #CLUSTER  # required cluster name
# mysql_seq: 1         #INSTANCE # {1} for standalone, {1,2,3} for MGR

#-----------------------------------------------------------------
# MYSQL_BUSINESS
#-----------------------------------------------------------------
mysql_root_password: DBUser.Root
mysql_monitor_password: DBUser.Monitor
mysql_cluster_password: DBUser.Cluster
mysql_databases: []              # [{ name, encoding, collate }]
mysql_users: []                  # [{ name, host, password, connlimit, priv }]
mysql_parameters: {}             # extra [mysqld] options, e.g. { max_connections: 500 }
mysql_data: /data/mysql          # mysql data directory, holds binlog and tmp too

#-----------------------------------------------------------------
# MYSQL_BACKUP
#-----------------------------------------------------------------
mysql_backup_enabled: true            # take one full physical backup per day?
mysql_backup_dir: /data/backups/mysql # local backup directory
mysql_backup_retention: 3             # full backups to keep, each as large as the data

#-----------------------------------------------------------------
# MYSQL_MONITOR
#-----------------------------------------------------------------
mysql_exporter_enabled: true

#-----------------------------------------------------------------
# NODE (Reference)
#-----------------------------------------------------------------
node_data: /data                  # node main data directory, /data by default
vip_enabled: false                # enable vip on this node cluster?
#-----------------------------------------------------------------
# CA (Reference)
#-----------------------------------------------------------------
cert_validity: 7300d              # cert validity, 20 years by default
...
