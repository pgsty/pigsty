---
mysql_instance: "{{ mysql_cluster }}-{{ mysql_seq }}"
mysql_initialized_marker: "{{ mysql_data }}/.pigsty-mysql-initialized"
mysql_initialized_marker_identity: { version: 1, cluster: "{{ mysql_cluster }}", instance: "{{ mysql_instance }}", topology: "{{ 'standalone' if groups[mysql_cluster] | length == 1 else 'innodb_cluster' }}" }
# members of this cluster outside the play: non-empty when one member leaves
mysql_rm_survivors: "{{ groups[mysql_cluster] | difference(ansible_play_hosts_all) | sort }}"
...
