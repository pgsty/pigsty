---
#-----------------------------------------------------------------
# MYSQL_REMOVE
#-----------------------------------------------------------------
# NOTE: like vault, the safeguard defaults to TRUE: this is a database.
mysql_safeguard: true             # prevents removing mysql instance? true by default
mysql_rm_data: true               # remove mysql data, config and router state? true by default
mysql_rm_pkg: false               # uninstall mysql packages? false by default
#-----------------------------------------------------------------
# MYSQL (Reference)
#-----------------------------------------------------------------
#mysql_cluster:                   # mysql cluster name, REQUIRED
#mysql_seq: 1                     # mysql instance identifier, REQUIRED
mysql_data: /data/mysql           # mysql data directory (must match the mysql role)
...
