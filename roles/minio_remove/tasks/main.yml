---
#--------------------------------------------------------------#
# Assert MinIO Identity                               [minio-id]
#--------------------------------------------------------------#
- name: minio identity
  tags: [ always, minio-id ]
  any_errors_fatal: true
  ignore_errors: false
  block:

    - name: assert minio identity
      assert:
        that:
          - minio_cluster is defined and minio_cluster != ''
          - minio_seq is defined and minio_seq|int >= 0
          - minio_type is defined
          - minio_type|default('') == 'silo'
        fail_msg: minio_cluster/minio_seq are required and minio_type must be silo

    - name: get minio cluster info
      connection: local
      set_fact:
        minio_meta: "{{ hostvars|json_query(cluster_query) }}"
        minio_data_dirs: >-
          {% set minio_multidriver =  minio_data | regex_search('{(\d+)...(\d+)}') %}{% if minio_multidriver and minio_multidriver != '' %}{% set minio_driver_min = (minio_data | regex_findall('{(\d+)...(\d+)}'))[0][0]|int %}{% set minio_driver_max = (minio_data | regex_findall('{(\d+)...(\d+)}'))[0][1]|int %}{% for i in range(minio_driver_min, minio_driver_max+1) | list %}{% if not loop.first %},{% endif %}{{ minio_data | regex_replace('{(\d+)...(\d+)}', i|string) }}{% endfor %}{% else %}{{ minio_data }}{% endif %}
      vars: { cluster_query: "[@.*][0][?minio_cluster=='{{ minio_cluster }}']" }

    - name: print minio purge task
      debug:
        msg: "WARNING: REMOVE {{ minio_type | upper }} {{ minio_cluster }}-{{ minio_seq }} | {% if minio_rm_data|bool %}REMOVE DATA{% else %}KEEP DATA{% endif %}: {{ minio_data_dirs }} | {% if minio_rm_pkg|bool %}UNINSTALL{% else %}KEEP PKG{% endif %}"


#--------------------------------------------------------------#
# HONOR MINIO_SAFEGUARD                        [minio_safeguard]
#--------------------------------------------------------------#
- name: ABORT due to minio_safeguard enabled
  connection: local
  when: minio_safeguard|bool
  tags: [ always , minio_safeguard ]
  any_errors_fatal: true
  ignore_errors: false
  fail: msg="Abort due to minio_safeguard for {{ minio_cluster }}-{{ minio_seq }} @ {{ inventory_hostname }} is enabled, override with -e minio_safeguard=false"


#--------------------------------------------------------------#
# PAUSE FOR CONFIRMATION                           [minio_pause]
#--------------------------------------------------------------#
# pause for 3 seconds to allow user to abort in case of fat finger
- name: "pause for confirmation, Use Ctrl-C to ABORT"
  tags: minio_pause
  pause: { seconds: 3 }


#--------------------------------------------------------------#
# remove minio targets from victoria          [minio_deregister]
#--------------------------------------------------------------#
- name: remove minio from victoria targets
  tags: [ minio_deregister, deregister , rm_metrics ]
  delegate_to: '{{ item }}'
  loop: '{{ groups["infra"]|default([]) }}'
  file: path="/infra/targets/minio/{{ minio_cluster }}-{{ minio_seq }}.yml" state=absent

#--------------------------------------------------------------#
# remove minio dns from infra dnsmasq [rm_dns][minio_deregister]
#--------------------------------------------------------------#
- name: remove minio dns from infra nameserver
  tags: [ minio_deregister, deregister, rm_dns ]
  delegate_to: '{{ item }}'
  loop: '{{ groups["infra"]|default([]) }}'
  file: path=/etc/dnsmasq.d/pigsty/{{ minio_cluster }}-{{ minio_seq }} state=absent

# minio is typically deployed on dedicated servers, so removing all minio dns entries is acceptable
- name: remove minio dns from local /etc/hosts
  tags: [ minio_deregister, deregister, rm_dns ]
  lineinfile: path=/etc/hosts regexp='# minio dns$' state=absent


#--------------------------------------------------------------#
# Remove minio service                               [minio_svc]
#--------------------------------------------------------------#
- name: stop minio service
  tags: [ minio, minio_svc, minio_stop, minio_data, minio_config ]
  shell: |
    systemctl disable {{ minio_type }} || true
    systemctl stop {{ minio_type }} || true

    # try graceful shutdown first again
    if pgrep -u {{ minio_user }} -x {{ minio_type }} > /dev/null ; then
        systemctl stop {{ minio_type }} || true
    fi

    # kill if still exists
    if pgrep -u {{ minio_user }} -x {{ minio_type }} > /dev/null ; then
        sleep 2
        pkill -u {{ minio_user }} -x {{ minio_type }} || true
    fi

    # kill -9 if not killed
    if pgrep -u {{ minio_user }} -x {{ minio_type }} > /dev/null ; then
        sleep 5
        pkill -9 -u {{ minio_user }} -x {{ minio_type }} || true
    fi
    # guaranteed success
    exit 0
  args: { executable: /bin/bash }


#--------------------------------------------------------------#
# Remove minio data                                 [minio_data]
#--------------------------------------------------------------#
# VERY DANGEROUS OPERATION!!!
- name: remove minio data
  tags: minio_data
  when: minio_rm_data|bool
  block:

    - name: remove minio data directories
      file: path="{{ item.strip() }}" state=absent
      loop: "{{ minio_data_dirs.split(',') }}"

    - name: remove minio config files
      tags: minio_config
      file: path={{ item }} state=absent
      loop: "{{ [
        '/etc/default/' ~ minio_type,
        '/home/' ~ minio_user ~ '/.minio',
        '/etc/systemd/system/' ~ minio_type ~ '.service'
        ] }}"
        #- /var/log/minio.log # we just keep the log files

    - name: reload systemd after minio unit removal
      tags: minio_config
      systemd: daemon_reload=yes

#--------------------------------------------------------------#
# Uninstall minio packages                           [minio_pkg]
#--------------------------------------------------------------#
- name: uninstall minio packages
  tags: minio_pkg
  when: minio_rm_pkg|bool
  package: name={{ item }} state=absent
  loop: [ "{{ minio_type }}" , mcli ]

...
