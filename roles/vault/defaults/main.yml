---
#-----------------------------------------------------------------
# VAULT
#-----------------------------------------------------------------
#vault_seq: 1                     # vault instance identifier, REQUIRED
vault_cluster: vault              # vault cluster name, vault by default
vault_data: /data/vault           # vault data dir: raft storage & snapshots
vault_port: 8200                  # vault api port, raft cluster port is +1
vault_domain: vault.pigsty        # vault service domain, used by cert SAN & clients

#-----------------------------------------------------------------
# NODE_VIP (Reference)
#-----------------------------------------------------------------
vip_enabled: false                # enable vip on this node cluster?
#-----------------------------------------------------------------
# CA (Reference)
#-----------------------------------------------------------------
cert_validity: 7300d              # cert validity, 20 years by default
#-----------------------------------------------------------------
# NODE (Reference)
#-----------------------------------------------------------------
node_data: /data                  # node main data directory, /data by default
...
