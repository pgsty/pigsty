# {{ ansible_managed }}
#---------------------------------------------------------------------
# service: vault @ {{ vault_vip }}:{{ vault_port }} (l2 vip of vault cluster)
#---------------------------------------------------------------------
# tls passthrough to the ACTIVE member: /v1/sys/health returns 200 on
# active, 429 on standby, 503 when sealed, 501 when not initialized
listen vault
    bind {{ vault_vip }}:{{ vault_port }}
    mode tcp
    maxconn 3000
    balance roundrobin
    option httpchk
    http-check send meth GET uri /v1/sys/health
    http-check expect status 200
    default-server inter 3s fastinter 1s downinter 5s rise 3 fall 3 on-marked-down shutdown-sessions slowstart 10s maxconn 3000 maxqueue 128 weight 100

    # server
{% for ip in vault_members %}
    server {{ vault_cluster }}-{{ hostvars[ip].vault_seq }} {{ ip }}:{{ vault_port }} check check-ssl verify required ca-file /etc/pki/ca.crt
{% endfor %}
