---
#--------------------------------------------------------------#
# Provision vault                              [vault_provision]
#--------------------------------------------------------------#
# enable default engines for business use:
#   secret/  : kv v2 secret engine
#   transit/ : encryption as a service
#   approle/ : app credential auth method
# allow long-lived tokens (10y) on token auth for pigsty consumers,
# and issue a snapshot-only token for vault-backup.
# consumers (pgsql pg_tde, minio kes) register their own mount, policy
# and credential when they are deployed.
- name: provision vault
  no_log: true
  when: vault_seq|int == vault_seq_min|int and (playbook_dir + '/files/pki/vault/init.json') is file
  environment:
    BAO_ADDR: "https://127.0.0.1:{{ vault_port }}"
    BAO_CACERT: /etc/openbao/tls/ca.crt
    BAO_TOKEN: "{{ (lookup('file', playbook_dir + '/files/pki/vault/init.json') | from_json).root_token }}"
  block:

    # tasks below are no_log: report a rejected root token explicitly instead of a censored failure
    - name: check vault root token
      command: bao token lookup -format=json
      register: vault_root_token_check
      changed_when: false
      failed_when: false

    - name: abort if vault root token is rejected
      when: vault_root_token_check.rc != 0
      no_log: false
      fail:
        msg: >-
          root_token in files/pki/vault/init.json does not work on {{ vault_instance }}:
          {{ vault_root_token_check.stderr | default('') | trim }}.
          On 'permission denied', init.json belongs to another cluster or the token was revoked: put the matching init.json back and retry.

    - name: list vault secret engines
      command: bao secrets list -format=json
      register: vault_mounts
      changed_when: false

    - name: enable kv v2 secret engine on secret/
      when: "'secret/' not in (vault_mounts.stdout | from_json)"
      command: bao secrets enable -path=secret -version=2 -description="pigsty kv secrets" kv

    - name: enable transit secret engine on transit/
      when: "'transit/' not in (vault_mounts.stdout | from_json)"
      command: bao secrets enable -path=transit -description="pigsty transit encryption" transit

    - name: list vault auth methods
      command: bao auth list -format=json
      register: vault_auths
      changed_when: false

    - name: enable approle auth method
      when: "'approle/' not in (vault_auths.stdout | from_json)"
      command: bao auth enable approle

    - name: allow long-lived tokens on token auth
      command: bao auth tune -max-lease-ttl=87600h token/
      changed_when: false

    - name: write vault-backup policy
      command:
        cmd: bao policy write vault-backup -
        stdin: |
          path "sys/storage/raft/snapshot" { capabilities = ["read"] }
      changed_when: false

    - name: check vault backup token on admin node
      become: false
      delegate_to: localhost
      stat: path=files/pki/vault/backup.token
      register: vault_backup_token_stat

    # a token left by a previous cluster (e.g. re-init after vault-rm) is invalid here, reissue it
    - name: validate vault backup token
      when: vault_backup_token_stat.stat.exists
      command:
        cmd: bao write -format=json auth/token/lookup token=-
        stdin: "{{ lookup('file', playbook_dir + '/files/pki/vault/backup.token') }}"
        stdin_add_newline: false
      register: vault_backup_token_check
      changed_when: false
      failed_when: false

    - name: issue vault backup token
      when: not vault_backup_token_stat.stat.exists or (vault_backup_token_check.rc | default(0)) != 0
      block:
        - name: create vault backup token
          no_log: true
          command: >-
            bao token create -orphan -no-default-policy -policy=vault-backup
            -display-name=vault-backup -ttl=87600h -format=json
          register: vault_backup_token
        - name: verify vault backup token ttl
          assert:
            that: (vault_backup_token.stdout | from_json).auth.lease_duration | int >= 315360000 - 600
            fail_msg: "vault backup token ttl is capped below 87600h, check token auth max_lease_ttl"
            quiet: true
        - name: save vault backup token to admin node
          become: false
          delegate_to: localhost
          no_log: true
          copy: content="{{ (vault_backup_token.stdout | from_json).auth.client_token }}" dest=files/pki/vault/backup.token mode=0600 backup=yes
...
