---
#==============================================================#
# File      :   openbao-rm.yml
# Desc      :   remove openbao from hosts
# Ctime     :   2026-07-30
# Mtime     :   2026-07-30
# Path      :   openbao-rm.yml
# Docs      :   https://pigsty.io/docs/openbao/playbook
